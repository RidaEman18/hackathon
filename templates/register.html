{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Account banayein</h1>
<p class="muted">Account se aap ka progress kisi bhi device par mil jata hai.</p>
{% if error %}<p class="fb" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="form narrow" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="name">Naam</label>
  <input id="name" name="name" autocomplete="name" minlength="2" maxlength="50" required autofocus value="{{ request.form.get('name', '') }}">
  <label for="email">Email</label>
  <input id="email" type="email" name="email" placeholder="name@example.com" autocomplete="email" inputmode="email" maxlength="254" required value="{{ request.form.get('email', '') }}">
  <label for="pw">Password</label>
  <input id="pw" type="password" name="password" autocomplete="new-password" minlength="8" required>
  <small class="muted">Kam az kam 8 harf, aur harf aur number dono.</small>
  <label for="confirm">Password dobara</label>
  <input id="confirm" type="password" name="confirm" autocomplete="new-password" minlength="8" required>
  <button class="btn" type="submit">Account banayein</button>
</form>
<p>Pehle se account hai? <a href="/login">Login</a></p>
{% endblock %}
