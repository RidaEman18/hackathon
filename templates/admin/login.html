{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<h1>Admin login</h1>
{% if default_pw %}<p class="fb">Dhyan dein: abhi default password <code>admin123</code> chal raha hai. Asli istemal se pehle <code>ADMIN_PASSWORD</code> set karein.</p>{% endif %}
{% if error %}<p class="fb" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="form narrow">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="pw">Password</label>
  <input id="pw" type="password" name="password" autocomplete="current-password" required autofocus>
  <button class="btn" type="submit">Login</button>
</form>
{% endblock %}
