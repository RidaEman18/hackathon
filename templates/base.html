<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}qadam.{% endblock %} | Take it one step at a time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% set p = request.path %}
<header class="top">
  <a class="logo" href="/">qadam<span class="stop">.</span></a>
  <nav class="nav" aria-label="Main">
    <a href="/" class="{{ 'on' if p == '/' }}"><i>🏠</i>Home</a>
    <a href="/path" class="{{ 'on' if p == '/path' }}"><i>🪨</i>My Path</a>
    <a href="/learn" class="{{ 'on' if p.startswith('/learn') }}"><i>📖</i>Learn</a>
    <a href="/practice" class="{{ 'on' if p == '/practice' }}"><i>🧪</i>Practice</a>
    <a href="/safety" class="{{ 'on' if p == '/safety' }}"><i>🛡️</i>Safety</a>
    <a href="/assistant" class="helper {{ 'on' if p == '/assistant' }}"><i>💬</i>Helper</a>
  </nav>
</header>
<div class="access" role="toolbar" aria-label="Accessibility">
  <button id="a-minus" type="button" aria-label="Smaller text">A−</button>
  <button id="a-plus" type="button" aria-label="Bigger text">A+</button>
  <button id="simple-toggle" type="button" aria-pressed="false">Simple words</button>
  <button id="read-page" type="button">🔊 Read aloud</button>
  <label for="speech-rate">Speed</label>
  <select id="speech-rate" aria-label="Reading speed">
    <option value="0.75">Slow</option>
    <option value="0.9" selected>Normal</option>
    <option value="1.1">Fast</option>
  </select>
  <button id="speech-pause" type="button">⏸ Pause</button>
  <button id="speech-resume" type="button">▶ Resume</button>
  <button id="speech-stop" type="button">■ Stop</button>
  <span id="speech-status" role="status" aria-live="polite"></span>
</div>
<main id="main">{% block content %}{% endblock %}</main>
<footer class="foot">
  <p><strong>qadam.</strong> Take it one step at a time. Practice rooms are simulations. Nothing in them is real.</p>
</footer>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="{{ url_for('static', filename='js/voice.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
